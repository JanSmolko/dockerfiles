# NOTE: this model does not reliably emit tool_calls via llama-server's jinja parser
# (verified 2026-09-21) - Cursor agent/file-access features will NOT work.
# Use docker-compose-qwen3_6-35b-a3b.yml for agentic/file-access use in Cursor.

name: llama-qwen2-5-coder-3b

services:
  llama-server:
    image: llama-server:gtx1060
    container_name: llama-server
    labels:
      - "llm.model=Qwen 2.5 Coder 3B"
    restart: unless-stopped
    ipc: host
    ports:
      - "7000:8080"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    tmpfs:
      - /usr/local/cuda/compat
    volumes:
      - ./models:/models
    command:
      - "-m"
      - "/models/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf"
      - "--alias"
      - "local-model"
      - "--jinja"
      - "-c"
      - "32768"        # Expanded context window to 32,768 tokens
      - "-ctk"
      - "q8_0"         # 8-bit Key cache quantization
      - "-ctv"
      - "q8_0"         # 8-bit Value cache quantization
      - "-ngl"
      - "99"           # Offload all layers to GPU
      - "-np"
      - "1"
      - "-fa"
      - "auto"
      - "--temperature"
      - "0.2"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    networks:
      - ai-network

networks:
  ai-network:
    external: true
