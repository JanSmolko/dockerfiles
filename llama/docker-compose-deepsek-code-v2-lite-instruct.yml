services:
  llama-server:
    image: llama-server:gtx1060
    container_name: llama-moe-server
    restart: unless-stopped
    ports:
      - "7000:8080"
    environment:
      - LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    tmpfs:
      - /usr/local/cuda/compat
    volumes:
      - ./models:/models
    command:
      - "-m"
      - "/models/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf" # Massive MoE Coding Model
      - "--jinja"
      - "-c"
      - "16384"        # Squeezed to 16k context to protect 6GB GPU limit
      - "-fa"          # Flash attention mandatory here
      - "-ctk"
      - "q8_0"         
      - "-ctv"
      - "q8_0"         
      - "-ngl"
      - "0"            # Mandatory 0 to keep active experts running via system RAM
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llama-server:8080/v1
      - OPENAI_API_KEY=dummy
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - llama-server

volumes:
  open-webui_data:
